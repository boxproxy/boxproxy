[package]
name = "boxctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4.3"
jsonc-parser = { version = "0.33.0", features = ["serde", "serde_json"] }
libc = "0.2"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_norway = "0.9.42"
yaml-rust2 = "0.13.0"

[target.'cfg(unix)'.dependencies]
netlink-sys = "0.9.0"
nix = { version = "0.31.3", features = ["process"] }
